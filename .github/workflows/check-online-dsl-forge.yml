name: Check online-dsl-forge

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  versioning:
    name: Versioning checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # 6.1.0
        with:
          run_install: false
          cache: false

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript lint
        run: pnpm run lint

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: TypeScript tests
        run: pnpm run test

      - name: Cargo version placeholders
        run: pnpm run versioning:check

  source-structure:
    name: Source structure checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Rust module size
        run: tests/scripts/check-rust-module-size.sh

  test:
    name: Test with rust-1.98.1
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup component add rustfmt clippy --toolchain 1.98.1

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Tests rustfmt
        run: tests/scripts/check-tests-rustfmt.sh

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo test
        run: cargo test --all-features --locked

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.fuzz_profile.name }}, ${{ matrix.fuzz_target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fuzz_profile:
          - name: stable
            toolchain: 1.98.1
          - name: asan
            toolchain: nightly-2026-09-08
        fuzz_target:
          - dsl_expression
          - expression_pipeline
          - rulepack_render

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Install pinned Rust toolchain
        env:
          FUZZ_PROFILE: ${{ matrix.fuzz_profile.name }}
          FUZZ_TOOLCHAIN: ${{ matrix.fuzz_profile.toolchain }}
        run: |
          if [[ "$FUZZ_PROFILE" == "asan" ]]; then
            rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --component llvm-tools-preview
          else
            rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          fi

      - name: Install pinned cargo-fuzz
        env:
          FUZZ_TOOLCHAIN: ${{ matrix.fuzz_profile.toolchain }}
        run: |
          cargo "+$FUZZ_TOOLCHAIN" install cargo-fuzz --version 0.13.2 --locked
          test "$(cargo "+$FUZZ_TOOLCHAIN" fuzz --version)" = "cargo-fuzz 0.13.2"

      - name: Run bounded smoke target
        env:
          ONLINE_DSL_FORGE_FUZZ_PROFILE: ${{ matrix.fuzz_profile.name }}
        run: tests/scripts/run-fuzz-target.sh smoke ${{ matrix.fuzz_target }}

      - name: Upload fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: online-dsl-forge-${{ matrix.fuzz_profile.name }}-${{ matrix.fuzz_target }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/online-dsl-forge-fuzz-artifacts/${{ matrix.fuzz_target }}
            ${{ runner.temp }}/online-dsl-forge-fuzz-failures/${{ matrix.fuzz_target }}
          if-no-files-found: ignore
          retention-days: 90

  rust-advisory-checks:
    name: Rust advisory checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install Rust advisory tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny advisories
        run: cargo deny check advisories
