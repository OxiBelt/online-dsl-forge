[package]
name = "online-dsl-forge"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "A bounded parser and runtime for in-memory DSL expressions."
repository = "https://github.com/OxiBelt/online-dsl-forge"
readme = "README.md"
publish = false

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[dev-dependencies]
arbitrary = "1.4.2"
serde-saphyr = { version = "1.1.0", default-features = false, features = ["deserialize"] }

[[bin]]
name = "online-dsl-forgectl"
path = "src/bin/online-dsl-forgectl.rs"

[[test]]
name = "public_api"
path = "../tests/rust/public_api.rs"

[[test]]
name = "parser_api"
path = "../tests/rust/parser_api.rs"

[[test]]
name = "sema_api"
path = "../tests/rust/sema_api.rs"

[[test]]
name = "cli"
path = "../tests/rust/cli.rs"

[[test]]
name = "golden"
path = "../tests/rust/golden.rs"

[[test]]
name = "rulepack_render"
path = "../tests/rust/rulepack_render.rs"

[[test]]
name = "fuzz_program_contract"
path = "../tests/rust/fuzz_program_contract.rs"

[[test]]
name = "fuzz_regressions"
path = "../tests/rust/fuzz_regressions.rs"
